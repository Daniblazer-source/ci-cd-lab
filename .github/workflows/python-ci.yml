name: python CI

on: push 

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get respository files
        uses: actions/checkout@v4
        
      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt
        
      - name: Run tests
        run: python -m pytest -v
      
        
